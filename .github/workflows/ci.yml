name: Arch Linux CI Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile & Verify (Arch Linux Container)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Sync mirrors and install toolchain dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm cmake ninja git nlohmann-json

      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Configure CMake with Ninja
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile core libraries and binaries
        run: cmake --build build --parallel $(nproc)

      - name: Verify build artifact integrity
        run: |
          test -f build/bin/ElyOS_Installer
          ls -lh build/bin/ElyOS_Installer
